services:
  opencode-env:
    build: ./opencode-build
    container_name: opencode-dev
    restart: unless-stopped
    environment:
      STRATA_API_KEY: "sk-strata-yhlgrrWsqXKw5BZnZH50hR2ZSWipOlaE"
    volumes:
      - ./workspace:/workspace
      - ./opencode-files/opencode-data:/home/opencode-dev/.local/share/opencode
      - ./opencode-files/opencode-state:/home/opencode-dev/.local/state/opencode
      - ./opencode-files/opencode-cache:/home/opencode-dev/.cache/opencode
      - ./opencode-files/opencode-config:/home/opencode-dev/.config/opencode
      - /var/run/docker.sock:/var/run/docker.sock
#      - /opencode-files/opencode-tmp:/tmp
    working_dir: /workspace
    group_add:
      - "973"
    network_mode: host
    stdin_open: true
    tty: true
